[project]
name = "notification-service"
version = "0.1.0"
description = "Generic HTTP notification sender"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pydantic>=2.9.1,<3.0.0",
    "httpx>=0.27.2,<0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
