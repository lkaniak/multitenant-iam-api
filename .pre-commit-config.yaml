repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: python
        types: [file, python]
        additional_dependencies: [black]

      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: python
        types: [file, python]
        additional_dependencies: [ruff]

      - id: uv-requirements
        name: Generate requirements.txt with uv
        entry: bash -c 'if git diff --cached pyproject.toml | grep -q "^+.*dependencies\|^+.*\[dependency-groups\]"; then echo "# This file is auto-generated by uv. Do not edit manually." > requirements.txt && echo "" >> requirements.txt && uv export --format requirements-txt --no-hashes --no-header --no-annotate >> requirements.txt; fi'
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false
        always_run: false
