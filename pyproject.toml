[project]
name = "multitenant-iam-api"
version = "1.0.0"
description = "Multitenant identity and access management API"
authors = [
    {name = "Lucas Dias Kaniak", email = "contact.lkaniak@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.114.2,<0.115.0",
    "loguru>=0.7.2,<0.8.0",
    "pydantic>=2.9.1,<3.0.0",
    "pydantic-settings>=2.5.2,<3.0.0",
    "pymongo>=4.8.0,<5.0.0",
    "uvicorn>=0.30.6,<0.31.0",
    "python-multipart>=0.0.9,<0.1.0",
    "pyjwt>=2.9.0,<3.0.0",
    "pytz>=2024.2,<2025.0",
    "babel>=2.16.0,<3.0.0",
    "pyotp>=2.9.0,<3.0.0",
    "notification-service",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["packages/notification-service"]

[tool.uv.sources]
notification-service = { workspace = true }

[tool.uv]
package = false
dev-dependencies = [
    "black>=24.8.0,<25.0.0",
    "isort>=5.13.2,<6.0.0",
    "flake8>=7.1.1,<8.0.0",
    "pre-commit>=4.0.1,<5.0.0",
    "ruff>=0.6.0,<0.7.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "mongomock>=4.2.0,<5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
/(
  \.git
 | \.hg
 | \.mypy_cache
 | \.tox
 | \.venv
 | _build
 | buck-out
 | build
 )/
'''
