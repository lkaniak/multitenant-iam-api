services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  notifications:
    image: python:3.11-slim
    command: ["python", "/sink.py"]
    volumes:
      - ./packages/notification-service/notification_sink.py:/sink.py:ro
    ports:
      - "8080:8080"

  api:
    build: .
    ports:
      - "8150:8150"
    depends_on:
      mongo:
        condition: service_healthy
      notifications:
        condition: service_started
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE_NAME: iam
      AUTH_SECRET_KEY: local-demo-auth-secret-key-32b
      AUTH_ALGORITHM: HS256
      MFA_SECRET_KEY: local-demo-mfa-secret-key
      EXPIRATION_MFA_OTP_CODE_IN_SECONDS: "30"
      API_URL: http://localhost:8150
      APP_CLIENT_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      API_VERSION: ""
      TRACKING_LOG_PII: "false"
      NOTIFICATION_HTTP_BASE_URL: http://notifications:8080

volumes:
  mongo_data:
